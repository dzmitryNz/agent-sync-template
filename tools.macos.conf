# Tools for macOS. Same format as tools.conf: command :: how to install :: why it is needed
# Check: bin/tools-check.sh   Install with brew: --install
# Homebrew first (https://brew.sh): every line below except claude installs with it.

# --- what the scripts need on macOS ---
brew :: see https://brew.sh :: package manager for everything below
gdate :: brew install coreutils :: GNU date, stat, timeout: the scripts use their Linux options
gsed :: brew install gnu-sed :: GNU sed -i
gfind :: brew install findutils :: GNU find -printf and xargs -r

# --- code search (rule "Code search: codegraph, not grep") ---
node :: brew install node :: needed for codegraph, ast-grep, MCP
codegraph :: npm i -g @colbymchenry/codegraph :: OPTIONAL index of symbols and relations
rg :: brew install ripgrep :: OPTIONAL text search with -l/-c
ast-grep :: brew install ast-grep :: OPTIONAL structural search by AST
fd :: brew install fd :: OPTIONAL replacement for find

# --- tasks and code work ---
gh :: brew install gh :: OPTIONAL PRs and review (always with --json)
git :: brew install git :: -
jq :: brew install jq :: JSON parsing in hooks and scripts
yq :: brew install yq :: OPTIONAL YAML parsing
mysql :: brew install mysql-client :: OPTIONAL (project-specific): database checks by the DB agent
pnpm :: brew install pnpm :: OPTIONAL wt-install: own node_modules in a worktree, no symlink

# --- agent environment ---
claude :: curl -fsSL https://claude.ai/install.sh | bash :: Claude Code itself
herdr :: brew install herdr :: terminal multiplexer
