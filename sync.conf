# What to sync between machines. Paths are relative to $HOME, one per line.
# Globs (*) work; a line starting with '!' excludes a match.
# This file syncs itself, so an edit here arrives on every machine.

# Claude Code
.claude/CLAUDE.md
.claude/AGENTS.md
.claude/settings.json
.claude/hooks
.claude/skills
.claude/plans
# .claude/settings.local.json stays on this machine (permissions, extra dirs).
# Per-project memory is opt-in. Uncomment one project key, do not sync every project:
# .claude/projects/<project-key>/memory

# Herdr (terminal multiplexer for agents)
.config/herdr/config.toml

# Other agents or tools: add your own paths here, for example
#.config/<tool>/config.toml

# Herdr — intentionally NOT synced:
#   .config/herdr/session.json    pane layout of this machine
#   herdr*.sock, herdr-*.log      sockets and logs
#   .local/state/herdr            agent-detection state

# Cross-host messaging (optional). tailcat addresses are intentionally NOT synced:
#   .config/herdr-hosts.conf      tailcat addresses of other hosts are a secret (they let you
#                                 connect) and differ per machine: create it by hand.
#                                 See systemd/tailcat-serve.service and the README
#                                 section "Cross-host messaging (optional)".

# Not synced: .claude/.credentials.json, .claude.json (machine-specific),
# caches and session transcripts (transcripts: bin/history-sync.sh, if SYNC_SERVER is set).
