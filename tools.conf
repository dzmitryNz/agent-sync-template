# Tools that the rules from CLAUDE.md rely on.
# Format: command :: how to install :: why it is needed
# Check: bin/tools-check.sh   Install what works without sudo: --install

# --- code search (rule "Code search: codegraph, not grep") ---
node :: nvm install 22 :: needed for codegraph, ast-grep, MCP
codegraph :: npm i -g @colbymchenry/codegraph :: OPTIONAL index of symbols and relations
rg :: d=$(mktemp -d) && url=$(curl -fsSL https://api.github.com/repos/BurntSushi/ripgrep/releases/latest | jq -r --arg a "$(uname -m)" '.assets[]|select(.name|test($a+"-unknown-linux-(musl|gnu).tar.gz$")).browser_download_url'|head -1) && curl -fsSL "$url" -o "$d/rg.tgz" && tar xzf "$d/rg.tgz" -C "$d" && mkdir -p "$HOME/.local/bin" && install -m 755 "$d"/*/rg "$HOME/.local/bin/rg" && rm -rf "$d" :: OPTIONAL text search with -l/-c
ast-grep :: npm i -g @ast-grep/cli :: OPTIONAL structural search by AST
fd :: d=$(mktemp -d) && url=$(curl -fsSL https://api.github.com/repos/sharkdp/fd/releases/latest | jq -r --arg a "$(uname -m)" '.assets[]|select(.name|test($a+"-unknown-linux-gnu.tar.gz$")).browser_download_url'|head -1) && curl -fsSL "$url" -o "$d/fd.tgz" && tar xzf "$d/fd.tgz" -C "$d" && mkdir -p "$HOME/.local/bin" && install -m 755 "$d"/*/fd "$HOME/.local/bin/fd" && rm -rf "$d" :: OPTIONAL replacement for find

# --- tasks and code work ---
gh :: sudo apt install gh :: OPTIONAL PRs and review (always with --json)
git :: sudo apt install git :: -
jq :: sudo apt install jq :: JSON parsing in hooks and scripts
yq :: a=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/') && mkdir -p "$HOME/.local/bin" && curl -fsSL "https://github.com/mikefarah/yq/releases/latest/download/yq_linux_$a" -o "$HOME/.local/bin/yq" && chmod +x "$HOME/.local/bin/yq" :: OPTIONAL YAML parsing
mysql :: sudo apt install mysql-client-core-8.0 :: OPTIONAL (project-specific): database checks by the DB agent
pnpm :: npm i -g pnpm :: OPTIONAL wt-install: own node_modules in a worktree, no symlink

# --- agent environment ---
claude :: curl -fsSL https://claude.ai/install.sh | bash :: Claude Code itself
herdr :: curl -fsSL https://herdr.dev/install.sh | sh :: terminal multiplexer
ralphex :: (a=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/') && d=$(mktemp -d) && gh release download -R umputun/ralphex -p "ralphex_*_linux_$a.tar.gz" -p 'ralphex_*_checksums.txt' -D "$d" && (cd "$d" && sha256sum -c --ignore-missing ralphex_*_checksums.txt) && tar xzf "$d"/ralphex_*_linux_"$a".tar.gz -C "$d" && mkdir -p "$HOME/.local/bin" && install -m 755 "$d/ralphex" "$HOME/.local/bin/ralphex" && rm -rf "$d") :: OPTIONAL autonomous plan runs; not in npm, only GitHub releases
