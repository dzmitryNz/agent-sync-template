# Short worktree prefixes for wt-new: <repo dir name> = <short>
# Worktree path: $PROJECT_ROOT/.worktrees/<short>-<task>. A repo not listed here uses its full name.
# Lines starting with # and blank lines are ignored.
#
# Example: put one line per repository that lives under $PROJECT_ROOT.
#   acme-api       = api
#   acme-web       = web
#   acme-auth      = auth
#   acme-schema = mig
